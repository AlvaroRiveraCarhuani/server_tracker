name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-go-agent:
    name: Test Go Data Plane Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent/go.sum

      - name: Verify Go module dependencies
        run: go mod verify

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go Unit Tests
        run: go test -v -race -cover ./...

      - name: Build Agent Binary
        run: go build -v -o bin/solv-agent ./cmd/solv-agent

  test-python-backend:
    name: Test Python Control Plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Python Syntax Check & Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          python -m compileall .
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No test directory found yet for Python backend. Syntax compiled cleanly."
          fi

  release-agent-binaries:
    name: Release Go Agent Binaries
    needs: [test-go-agent, test-python-backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build Linux amd64
        run: |
          cd agent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../dist/solv-agent-linux-amd64 ./cmd/solv-agent

      - name: Build Linux arm64
        run: |
          cd agent
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../dist/solv-agent-linux-arm64 ./cmd/solv-agent

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solv-agent-binaries
          path: dist/